name: Publish verified installer candidate
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact successful private build source commit
        required: true
      installer_sha256:
        description: SHA-256 independently verified before dispatch
        required: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_URL: ${{ secrets.MOMENTUM_INSTALLER_ARTIFACT_URL }}
      EXPECTED_SOURCE: ${{ inputs.source_commit }}
      EXPECTED_SHA256: ${{ inputs.installer_sha256 }}
    steps:
      - name: Verify installer-only artifact and publish complete prerelease
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,shutil,subprocess,tempfile,urllib.request,zipfile
          version='1.3.0-rc.1'
          name=f'MomentumEXE-Member-{version}-windows-x64-Setup.exe'
          expected={name,'release-manifest.json','SHA256SUMS.txt','INSTALL.md'}
          source=os.environ['EXPECTED_SOURCE'];digest=os.environ['EXPECTED_SHA256']
          if not re.fullmatch('[a-f0-9]{40}',source) or not re.fullmatch('[a-f0-9]{64}',digest):raise SystemExit('Invalid build identity')
          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)
              return h.hexdigest()
          with tempfile.TemporaryDirectory() as tmp:
              root=pathlib.Path(tmp);archive=root/'artifact.zip';out=root/'public';out.mkdir()
              try:
                  url=os.environ['CANDIDATE_URL']
                  if not url.startswith('https://'):raise ValueError()
                  with urllib.request.urlopen(url,timeout=90) as r,archive.open('wb') as f:shutil.copyfileobj(r,f,1024*1024)
                  with zipfile.ZipFile(archive) as z:
                      files={x.filename for x in z.infolist() if not x.is_dir()}
                      if files!={'output/'+x for x in expected}|{'windows-smoke.json','resolved-requirements.txt'}:raise ValueError()
                      smoke=json.loads(z.read('windows-smoke.json'))
                      if not all(smoke.get(k) is True for k in ('blocked_unknown','install','upgrade','journal_preserved')):raise ValueError()
                      frozen=smoke['frozen_smoke']
                      if frozen.get('runtime_version')!='member-desktop-1.3.0' or not all(frozen.get(k) is True for k in ('frozen','ui_ready','browser_bundled','browser_launch','webview_backend','wib_timezone')):raise ValueError()
                      for filename in expected:
                          with z.open('output/'+filename) as r,(out/filename).open('wb') as f:shutil.copyfileobj(r,f,1024*1024)
                  m=json.loads((out/'release-manifest.json').read_text())
                  base=f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/v{version}/'
                  if m.get('source_commit')!=source or m.get('version')!=version or m.get('runtime_version')!='member-desktop-1.3.0' or m.get('channel')!='candidate' or m.get('platform')!='windows-x64' or m.get('live_broker_acceptance') is not False or m.get('windows_install_smoke') is not True or m.get('bound_execution_default') is not False:raise ValueError()
                  if m['installer']['name']!=name or m['installer']['url']!=base+name or m['installer']['sha256']!=digest or sha(out/name)!=digest or (out/name).stat().st_size!=m['installer']['size']:raise ValueError()
                  if set((out/'SHA256SUMS.txt').read_text().splitlines())!={sha(out/x)+'  '+x for x in expected-{'SHA256SUMS.txt'}}:raise ValueError()
              except Exception:raise SystemExit('Artifact download/verification failed; no publication performed.') from None
              subprocess.run(['gh','release','upload','v'+version,'--repo',os.environ['GITHUB_REPOSITORY'],*[str(out/x) for x in sorted(expected)]],check=True)
              subprocess.run(['gh','release','edit','v'+version,'--repo',os.environ['GITHUB_REPOSITORY'],'--draft=false','--prerelease'],check=True)
              print('VERIFIED INSTALLER CANDIDATE PUBLISHED; source/backend not uploaded.')
          PY
